name: Server CI

on:
  push:
    paths:
      - 'server/**'
      - 'requirements.txt'
      - 'recetas.json'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'requirements.txt'
      - 'recetas.json'
      - '.github/workflows/server-ci.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile server
        run: python -m compileall server

      - name: Run server tests
        if: ${{ hashFiles('server/tests*.py') != '' }}
        working-directory: server
        run: pytest -q tests_unidad.py tests_integracion.py tests_sistema.py

      - name: Run SC-05 Backend Integration Tests
        if: ${{ hashFiles('server/test_sc_05_integracion.py') != '' }}
        working-directory: server
        run: pytest -q -v test_sc_05_integracion.py